name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

jobs:
  quality:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit & integration tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build
        env:
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_API_URL: https://api.example.invalid

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E smoke (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
      - name: Install Chromium
        run: pnpm --filter @medetherial/web exec playwright install --with-deps chromium
      - name: Run smoke tests
        run: pnpm --filter @medetherial/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build Keycloak image
        uses: docker/build-push-action@v6
        with:
          context: infra/keycloak
          push: false
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
      - name: Validate realm export
        run: python3 -c "import json; d=json.load(open('infra/keycloak/realm-export.json')); assert d['realm']=='medetherial'"
